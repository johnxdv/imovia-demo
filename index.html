    <!-- Polices auto-hébergées. Les déclarations `@font-face` sont en tête de
         `src/index.css`, avec le détail de ce qui a été retenu et pourquoi.

         Seule Fraunces latin est préchargée : c'est la police des H1 et des
         grands titres, donc celle du plus gros élément de texte de l'écran
         d'accueil — le plus souvent l'élément qui décide du Largest Contentful
         Paint. Précharger les quatre familles reviendrait à les mettre toutes
         en concurrence sur le chemin critique, ce qui ne presse aucune. Le
         `crossorigin` est obligatoire même en même origine : une police est
         toujours demandée en mode CORS, et sans lui le préchargement est
         ignoré et le fichier téléchargé deux fois. -->
    <link
      rel="preload"
      href="/fonts/fraunces-400-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>IMMOVIA — Agence immobilière · Diebling</title>

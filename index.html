    <!-- Fonts : Fraunces (display serif), Inter (texte), IBM Plex Mono (données).

         `.titre-etape` dans `src/index.css`). Elle n'existe qu'en une seule

         fabrique pas de fausse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Prata&display=swap"
